<!DOCTYPE html>
<html>
<head>
    <title>Generate Icons</title>
</head>
<body>
    <canvas id="canvas16" width="16" height="16"></canvas>
    <canvas id="canvas48" width="48" height="48"></canvas>
    <canvas id="canvas128" width="128" height="128"></canvas>
    
    <script>
        function drawIcon(canvas) {
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            const scale = size / 128;
            
            ctx.scale(scale, scale);
            
            // Background circle
            ctx.fillStyle = '#2196F3';
            ctx.beginPath();
            ctx.arc(64, 64, 60, 0, Math.PI * 2);
            ctx.fill();
            
            // Bus body
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.roundRect(30, 40, 68, 50, 8);
            ctx.fill();
            
            // Windows
            ctx.fillStyle = '#2196F3';
            ctx.beginPath();
            ctx.roundRect(35, 50, 28, 25, 3);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(65, 50, 28, 25, 3);
            ctx.fill();
            
            // Wheels
            ctx.fillStyle = '#424242';
            ctx.beginPath();
            ctx.arc(45, 90, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(83, 90, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Clock indicator
            ctx.fillStyle = '#FF9800';
            ctx.beginPath();
            ctx.arc(95, 35, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Clock hands
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(95, 35);
            ctx.lineTo(95, 27);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(95, 35);
            ctx.lineTo(100, 35);
            ctx.stroke();
        }
        
        // Draw on all canvases
        drawIcon(document.getElementById('canvas16'));
        drawIcon(document.getElementById('canvas48'));
        drawIcon(document.getElementById('canvas128'));
        
        // Download images
        ['16', '48', '128'].forEach(size => {
            const canvas = document.getElementById('canvas' + size);
            const link = document.createElement('a');
            link.download = 'icon' + size + '.png';
            link.href = canvas.toDataURL();
            document.body.appendChild(link);
            link.click();
        });
    </script>
</body>
</html>
