<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyETA</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <button id="back-btn" class="header-back hidden" aria-label="Back">
                <svg class="icon" viewBox="0 0 24 24"><use href="../icons/sprite.svg#icon-arrow-left"/></svg>
            </button>
            <div class="header-main">
                <h1 id="header-title" class="header-title">EasyETA</h1>
                <div id="header-sub" class="header-sub hidden"></div>
            </div>
            <button id="refresh-btn" class="header-btn hidden" aria-label="Refresh">
                <svg class="icon" viewBox="0 0 24 24"><use href="../icons/sprite.svg#icon-refresh"/></svg>
            </button>
        </header>

        <main class="main-content">
            <!-- HOME -->
            <section id="view-home" class="view active">
                <div id="fav-tabs" class="tab-group"></div>
                <div id="favorites-list" class="section-group"></div>
                <div class="section-title" data-section="recent">
                    <span data-i18n="home.recent">Recent Searches</span>
                    <span class="expand-icon"><svg class="icon icon-xs" viewBox="0 0 24 24"><use href="../icons/sprite.svg#icon-arrow-down"/></svg></span>
                </div>
                <div id="recent-list" class="section-group"></div>
            </section>

            <!-- SEARCH -->
            <section id="view-search" class="view">
                <div class="search-container">
                    <div class="segmented-control" id="search-mode-toggle">
                        <button class="segment-btn active" data-mode="route" data-i18n="search_type.route">Route</button>
                        <button class="segment-btn" data-mode="stop" data-i18n="search_type.stop">Stop</button>
                    </div>
                    <div class="search-input-wrapper">
                        <span class="search-icon"><svg class="icon" viewBox="0 0 24 24"><use href="../icons/sprite.svg#icon-search"/></svg></span>
                        <input type="text" id="search-input" class="search-input" autocomplete="off" spellcheck="false"
                               data-i18n-placeholder="search.placeholder" placeholder="Route or stop (e.g. 968, Central)">
                        <button id="search-clear" class="search-clear hidden" aria-label="Clear">&times;</button>
                    </div>
                </div>
                <div id="search-results"></div>
            </section>

            <!-- DETAILS -->
            <section id="view-details" class="view">
                <div id="details-meta" class="details-meta"></div>
                <div id="stops-container"></div>
            </section>

            <!-- SETTINGS -->
            <section id="view-settings" class="view">
                <div class="settings-label" data-i18n="nav.settings">Settings</div>
                <div id="settings-list" class="section-group"></div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-target="view-home">
                <svg class="icon" viewBox="0 0 24 24"><use href="../icons/sprite.svg#icon-home"/></svg>
                <span class="nav-label" data-i18n="nav.home">Home</span>
            </button>
            <button class="nav-item" data-target="view-search">
                <svg class="icon" viewBox="0 0 24 24"><use href="../icons/sprite.svg#icon-search"/></svg>
                <span class="nav-label" data-i18n="nav.search">Search</span>
            </button>
            <button class="nav-item" data-target="view-settings">
                <svg class="icon" viewBox="0 0 24 24"><use href="../icons/sprite.svg#icon-settings"/></svg>
                <span class="nav-label" data-i18n="nav.settings">Settings</span>
            </button>
        </nav>

        <div id="app-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-dialog">
                <h3 id="modal-title" class="modal-title"></h3>
                <p id="modal-message" class="modal-message"></p>
                <div id="modal-actions" class="modal-actions"></div>
            </div>
        </div>
    </div>

    <script src="../scripts/storage.js"></script>
    <script src="../scripts/i18n.js"></script>
    <script src="../scripts/api.js"></script>
    <script src="popup.js"></script>
</body>
</html>
